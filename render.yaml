databases:
  - name: chatly_db
    databaseName: chatly
    user: chatly
    plan: free # Note: Free Postgres on Render expires after 90 days if not upgraded.
    ipAllowList: [] # Allow all IPs for external access if needed, or restrict.

services:
  - type: web
    name: chatly-server
    env: docker
    region: oregon
    plan: free
    # Docker runtime uses the Dockerfile for build and start commands
    envVars:
      - key: APP_NAME
        value: Chatly
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_URL
        sync: false # User must set this after deploy
      - key: APP_KEY
        value: base64:fnqSyEBRPGtbiOMjAcdTzuEjSR4MWu8QgActZjdra6o=
      - key: L5_SWAGGER_CONST_HOST
        sync: false # Set this to your URL + /api (e.g. https://.../api)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: chatly_db
          property: connectionString
      - key: SESSION_DRIVER
        value: cookie
      - key: LOG_CHANNEL
        value: stderr
