databases:
  - name: chatly_db
    databaseName: chatly
    user: chatly
    plan: free # Note: Free Postgres on Render expires after 90 days if not upgraded.
    ipAllowList: [] # Allow all IPs for external access if needed, or restrict.

services:
  - type: web
    name: chatly-server
    env: docker
    region: oregon
    plan: free
    # Docker runtime uses the Dockerfile for build and start commands
    envVars:
      - key: APP_NAME
        value: Chatly
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_URL
        sync: false # User must set this after deploy
      - key: APP_KEY
        value: base64:fnqSyEBRPGtbiOMjAcdTzuEjSR4MWu8QgActZjdra6o=
      - key: JWT_SECRET
        value: C77pxiwZywjHElsNndu6EpkIG+O9kdVo+MpHeMnEjMg=
      - key: L5_SWAGGER_CONST_HOST
        sync: false # Set this to your URL + /api (e.g. https://.../api)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: chatly_db
          property: connectionString
      - key: SESSION_DRIVER
        value: cookie
      - key: LOG_CHANNEL
        value: stderr
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: my-app-id
      - key: REVERB_APP_KEY
        value: my-app-key
      - key: REVERB_APP_SECRET
        value: my-app-secret
      - key: REVERB_HOST
        value: 0.0.0.0 # Must be 0.0.0.0 on Render to listen on all interfaces
      - key: REVERB_PORT
        value: 8080 # Internal port handled by Supervisor
      - key: REVERB_SCHEME
        value: http # Internal scheme
      
      # Frontend/Public connection details (passed to View/Vite)
      - key: VITE_REVERB_APP_KEY
        value: my-app-key
      - key: VITE_REVERB_HOST
        sync: false # Set this in Dashboard to your domain: chatly-server.onrender.com
      - key: VITE_REVERB_PORT
        value: 443
      - key: VITE_REVERB_SCHEME
        value: https
